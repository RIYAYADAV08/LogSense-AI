---
# Restart a failing service. Usage: ansible-playbook ansible/remediate.yml -e service_name=nginx
- name: LogSense remediation
  hosts: localhost
  become: true
  vars:
    service_name: nginx
  tasks:
    - name: Restart the suspect service
      ansible.builtin.service:
        name: "{{ service_name }}"
        state: restarted
