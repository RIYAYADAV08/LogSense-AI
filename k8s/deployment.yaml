apiVersion: apps/v1
kind: Deployment
metadata:
  name: logsense-ai
spec:
  replicas: 2
  selector:
    matchLabels: {app: logsense-ai}
  template:
    metadata:
      labels: {app: logsense-ai}
    spec:
      containers:
        - name: logsense-ai
          image: logsense-ai:latest
          ports: [{containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /health, port: 5000}
---
apiVersion: v1
kind: Service
metadata:
  name: logsense-ai
spec:
  type: NodePort
  selector: {app: logsense-ai}
  ports: [{port: 80, targetPort: 5000}]
